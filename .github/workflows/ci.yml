name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Heavy deps imported at module scope by the search stack:
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers pytest numpy

      # NOTE: sentence-transformers pulls ~2GB of model weights on first
      # import; if the tests trigger it, warm the cache via a dummy encode.
      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short

      - name: Upload failure log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-log
          path: .pytest_cache/
